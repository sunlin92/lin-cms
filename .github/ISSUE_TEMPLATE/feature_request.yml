name: 功能建议
description: 提出一个新功能或改进建议
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: 涉及组件
      options:
        - 后端（lin-cms-fastapi）
        - 前端（lin-cms-react）
        - CLI（lin-cms-cli）
        - 工程化（Makefile / CI）
        - 文档 / 契约
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么问题、什么场景下需要
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他做法，以及为什么不如期望方案
    validations:
      required: false
