[project]
name = "lin-cms-fastapi"
version = "0.1.0"
description = "Lin CMS backend rebuilt with FastAPI + SQLAlchemy (SQLite default, portable to PostgreSQL/MySQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "structlog>=24.1",
    "pydantic-settings>=2.2",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008: FastAPI 的 Depends()/Query() 参数默认值是框架惯例
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.File"]
